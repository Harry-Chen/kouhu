name: Build PDF
on: [push, workflow_dispatch]

# permissions:
#   contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Typst
        uses: lvignoli/typst-action@main
        with:
          source_file: doc/manual.typ
          options: |
            --root
            .
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF files
          path: '**/*.pdf'
